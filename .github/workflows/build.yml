name: Construire l'APK

on:
  push:
    branches: [main, master, 'claude/**']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Compiler
        run: gradle --no-daemon assembleDebug

      - name: Renommer l'APK
        run: cp app/build/outputs/apk/debug/app-debug.apk minuteur-applis.apk

      - uses: actions/upload-artifact@v4
        with:
          name: minuteur-applis
          path: minuteur-applis.apk

      # Publie l'APK dans l'onglet « Releases » : téléchargeable directement depuis le téléphone.
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: Version ${{ github.run_number }}
          files: minuteur-applis.apk
