plugins {
    id 'com.android.application'
}

android {
    namespace 'com.minuteur.applis'
    compileSdk 34

    defaultConfig {
        applicationId 'com.minuteur.applis'
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }

    // Clé de signature fixe, incluse dans le projet : chaque nouvelle version
    // s'installe par-dessus la précédente sans désinstaller.
    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    lint {
        abortOnError false
    }
}
